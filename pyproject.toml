[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtr-role-type-retrieval"
version = "0.4.1"
description = "RTR Role Type Retrieval — RRF-heuristic DTD semantic-capable retriever for opencode (dual ONNX ensemble, CPU-first)"
readme = "README-PYPI.md"
requires-python = ">=3.10"
license = { text = "Dual-licensed under EUPL-1.2 and AGPL-3.0-or-later. See LICENSE-EUPL-1.2.txt and LICENSE-AGPL-3.0.txt." }
authors = [{ name = "Nova-Violet Role ORG" }]
keywords = ["rag", "retrieval", "mcp", "opencode", "onnx", "rrf", "embeddings", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "chromadb>=1.5,<2",
  "fastembed>=0.9,<1",
  "watchdog>=6,<7",
  "fastmcp>=4,<5",
  "pyyaml>=6,<7",
]
urls = { Homepage = "https://github.com/Nova-Violet-Role/rtr-role-type-retrieval" }

[project.scripts]
rtr-mcp = "execution.memory_mcp_server:main"
rtr-cli = "execution.memory_cli:main"
rtr-re-mcp = "execution.memory_mcp_server:main"
rtr-re-install-opencode = "execution.install_opencode:main"
xpajonx-memory-mcp = "execution.memory_mcp_server:main"
xpajonx-memory-cli = "execution.memory_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["execution"]

[tool.hatch.build.targets.sdist.force-include]
"mjs/.opencode/plugins/rtr.mjs" = "mjs/.opencode/plugins/rtr.mjs"
"mjs/.opencode/plugins/rtr-frontmatter.cjs" = "mjs/.opencode/plugins/rtr-frontmatter.cjs"
"mjs/.opencode/command/rtr.md" = "mjs/.opencode/command/rtr.md"
"execution/rtr_presets.json" = "execution/rtr_presets.json"

[tool.hatch.build.targets.wheel.force-include]
"opencode-plugin/rtr-re-keeper.js" = "execution/assets/rtr-re-keeper.js"
"execution/rtr_presets.json" = "execution/rtr_presets.json"
"LICENSE-EUPL-1.2.txt" = "rtr_role_type_retrieval-0.4.1.dist-info/LICENSE-EUPL-1.2.txt"
"LICENSE-AGPL-3.0.txt" = "rtr_role_type_retrieval-0.4.1.dist-info/LICENSE-AGPL-3.0.txt"
"NOTICE" = "rtr_role_type_retrieval-0.4.1.dist-info/NOTICE"
