name: publish rtr-re

# Live since 1.2.0 (undrafted after the TODO-10 runner verification:
# every job replicated locally green, publish guards proven live in
# both directions, secrets present in the pypi/npm environments).
# Publishes the prepared dist/ set to all three platforms
# simultaneously: GitHub release, PyPI, npm.
#
# Secrets required (environment settings, all present):
#   PYPI_TOKEN  — PyPI API token (upload only)
#   NPM_TOKEN   — npm access token (publish)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match dist/ artifacts, e.g. 1.2.0)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-rtr-re
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build wheel + sdist
        run: |
          VERSION="${VERSION#v}"
          uv build --out-dir dist
          test -f "dist/rtr_role_type_retrieval-$VERSION-py3-none-any.whl"
          test -f "dist/rtr_role_type_retrieval-$VERSION.tar.gz"
      - name: Pack npm plugin tarball
        run: |
          VERSION="${VERSION#v}"
          npm pack --pack-destination dist ./opencode-plugin
          test -f "dist/rtr-re-opencode-plugin-$VERSION.tgz"
      - name: Pack mjs tarball
        run: |
          VERSION="${VERSION#v}"
          npm pack --pack-destination dist ./mjs
          test -f "dist/saimonokuma-rtr-re-mjs-$VERSION.tgz"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Artifacts must exist and match the version
        run: |
          VERSION="${VERSION#v}"
          test -f "dist/rtr_role_type_retrieval-$VERSION-py3-none-any.whl"
          test -f "dist/rtr_role_type_retrieval-$VERSION.tar.gz"
          test -f "dist/rtr-re-opencode-plugin-$VERSION.tgz"
          test -f "dist/saimonokuma-rtr-re-mjs-$VERSION.tgz"
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "resolved version: $VERSION"
      - name: Wheel metadata version check
        run: |
          VERSION="${{ env.version }}"
          unzip -p "dist/rtr_role_type_retrieval-$VERSION-py3-none-any.whl" \
            '*/METADATA' | grep -E "^Version: $VERSION$"
      - name: Wheel must carry the Python installer (launcher + shell + audio)
        run: |
          WHEEL="dist/rtr_role_type_retrieval-${{ env.version }}-py3-none-any.whl"
          unzip -l "$WHEEL" | grep -q "installer/launchers/python_launcher.py"
          unzip -l "$WHEEL" | grep -q "installer/shell/dtd/rtrre-scene.mod"
          unzip -l "$WHEEL" | grep -q "installer/shell/dtd/scenes/instrument.xml"
          unzip -l "$WHEEL" | grep -q "installer/shell/assets/audio/obsession-quick.mp3"
          unzip -l "$WHEEL" | grep -q "installer/shell/assets/audio/obsession-custom.mp3"
          unzip -l "$WHEEL" | grep -q "installer/shell/assets/audio/obsession-hardcore.mp3"
          unzip -p "$WHEEL" '*/entry_points.txt' | grep -q "rtr-re-install"
      - name: npm tarball must carry the Node installer (launcher + bin + shell + audio)
        run: |
          TGZ="dist/rtr-re-opencode-plugin-${{ env.version }}.tgz"
          tar -tzf "$TGZ" | grep -q "package/installer/launchers/node_launcher.mjs"
          tar -tzf "$TGZ" | grep -q "package/installer-bin.mjs"
          tar -tzf "$TGZ" | grep -q "package/installer/shell/dtd/rtrre-scene.mod"
          tar -tzf "$TGZ" | grep -q "package/installer/shell/assets/audio/obsession-quick.mp3"
          tar -tzf "$TGZ" | grep -q "package/installer/shell/assets/audio/obsession-custom.mp3"
          tar -tzf "$TGZ" | grep -q "package/installer/shell/assets/audio/obsession-hardcore.mp3"
          tar -xOf "$TGZ" package/package.json | grep -q '"rtr-re-installer"'
      - name: mjs tarball must exist and carry the plugin
        run: |
          TGZ="dist/saimonokuma-rtr-re-mjs-${{ env.version }}.tgz"
          tar -tzf "$TGZ" | grep -q "package/package.json"
          tar -tzf "$TGZ" | grep -q "package/plugin.json"

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Publish wheel + sdist to PyPI (skip if version already exists)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          VERSION="${VERSION#v}"
          if curl -fsS "https://pypi.org/pypi/rtr-role-type-retrieval/$VERSION/json" >/dev/null 2>&1; then
            echo "rtr-role-type-retrieval@$VERSION already published — skipping"
          else
            uv publish dist/rtr_role_type_retrieval-$VERSION-py3-none-any.whl dist/rtr_role_type_retrieval-$VERSION.tar.gz
          fi

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish plugin package (skip if version already exists)
        run: |
          VERSION="${VERSION#v}"
          if npm view "rtr-re-opencode-plugin@$VERSION" version >/dev/null 2>&1; then
            echo "rtr-re-opencode-plugin@$VERSION already published — skipping"
          else
            npm publish "$GITHUB_WORKSPACE/dist/rtr-re-opencode-plugin-$VERSION.tgz" --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish mjs package (skip if version already exists)
        run: |
          VERSION="${VERSION#v}"
          if npm view "@saimonokuma/rtr-re-mjs@$VERSION" version >/dev/null 2>&1; then
            echo "@saimonokuma/rtr-re-mjs@$VERSION already published — skipping"
          else
            npm publish "$GITHUB_WORKSPACE/dist/saimonokuma-rtr-re-mjs-$VERSION.tgz" --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-github:
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Resolve version
        run: |
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "resolved release version: $VERSION"
      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.version }}
          name: RTR-RE:Symbiose v${{ env.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/rtr_role_type_retrieval-${{ env.version }}-py3-none-any.whl
            dist/rtr_role_type_retrieval-${{ env.version }}.tar.gz
            dist/rtr-re-opencode-plugin-${{ env.version }}.tgz
            dist/saimonokuma-rtr-re-mjs-${{ env.version }}.tgz
